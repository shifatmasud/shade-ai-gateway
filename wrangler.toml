name = "shade-ai-gateway"
main = "src/index.js"
compatibility_date = "2026-11-14"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[vars]
PROVIDER_TIMEOUT_MS = "45000"
ALLOWED_ORIGINS = "*"

[previews.vars]
PROVIDER_TIMEOUT_MS = "45000"
ALLOWED_ORIGINS = "*"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false
persist = true
head_sampling_rate = 1
redact_query_string = true
